<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christian Boyles — Software Engineer (UI/UX · Frontend · Backend)</title>
    <meta
      name="description"
      content="Portfolio of Christian Boyles, a product-minded Junior Software Engineer in the Philippines specializing in UI/UX systems, frontend architecture, and backend engineering."
    />
    <meta name="theme-color" content="#121110" id="meta-theme-color" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Christian Boyles — Software Engineer (UI/UX · Frontend · Backend)" />
    <meta
      property="og:description"
      content="Designing interfaces with editorial clarity and engineering the full-stack systems underneath. React, TypeScript, Node/Express, Supabase & Figma."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          localStorage.removeItem("cb-theme");
          var saved = localStorage.getItem("cb-theme-v2");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.getElementById("meta-theme-color");
          if (meta) meta.setAttribute("content", theme === "dark" ? "#121110" : "#F6F3EC");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
